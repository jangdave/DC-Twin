# 저장소 루트에서: docker compose -f server/docker-compose.yml up --build
# 기본은 이 컴퓨터(127.0.0.1)에서만 닿는다. 밖에 여는 방법과 위험은 server/README.md의 "밖에 열기".
# 접근 토큰이 필요하다: 같은 폴더(또는 실행하는 곳)의 .env 파일에 DCT_TOKEN=<16자 이상>을 적는다(.env는 저장소에 올리지 않는다).
services:
  sim-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: dct-sim-server
    ports:
      - "127.0.0.1:8765:8765"
    # 허용할 웹 페이지 출처를 더하려면(예: 직접 올린 사이트): command: ["--solver", "l0", "--origin", "https://example.com"]
    environment:
      DCT_TOKEN: ${DCT_TOKEN:?server/.env 또는 환경 변수 DCT_TOKEN에 16자 이상 접근 토큰을 정해 주세요}
    restart: unless-stopped
    init: true  # 종료 신호와 좀비 프로세스를 처리하는 작은 init(PID 1)을 둔다
    read_only: true
    pids_limit: 128
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
